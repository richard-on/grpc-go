name: Flow-control investigation

on:
  push:
    branches: [investigate/9371-flow-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.repository == 'richard-on/grpc-go'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: ubuntu-24.04-i386
            runner: ubuntu-24.04
            arch: '386'
            flags: ''
          - name: ubuntu-26.04-i386
            runner: ubuntu-26.04
            arch: '386'
            flags: ''
          - name: ubuntu-24.04-race
            runner: ubuntu-24.04
            arch: amd64
            flags: '-race'
          - name: ubuntu-26.04-race
            runner: ubuntu-26.04
            arch: amd64
            flags: '-race'
    name: ${{ matrix.name }}
    env:
      GOARCH: ${{ matrix.arch }}
      GOWORK: 'off'
      GOTOOLCHAIN: 'local'
      GRPC_GO_EXPERIMENTAL_HTTP_FRAMER_READ_BUFFER_POOLING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flow-control-logs"
          {
            go version
            git rev-parse HEAD
            uname -a
            cat /etc/os-release
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            go env GOOS GOARCH GOTOOLCHAIN GOWORK
            printf 'HTTP framer read buffer pooling: %s\n' "$GRPC_GO_EXPERIMENTAL_HTTP_FRAMER_READ_BUFFER_POOLING"
            printf 'Unmodified upstream source; target reads remain raw TCP.\n'
            printf 'This compares runner images, including their kernels and userspace.\n'
            getconf _NPROCESSORS_ONLN
            free -h
            sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.ipv4.tcp_moderate_rcvbuf net.core.rmem_max
            getent ahosts localhost
          } | tee "$RUNNER_TEMP/flow-control-logs/environment.txt"
      - name: Build unmodified upstream source
        shell: bash
        run: |
          set -euo pipefail
          base=39ebc82c352a3302c3d7f748b4359e26689d9187
          source="$RUNNER_TEMP/flow-control-source"
          logs="$RUNNER_TEMP/flow-control-logs"
          git fetch --no-tags --depth=1 origin "$base"
          test "$(git rev-parse "$base^{commit}")" = "$base"
          mkdir -p "$source"
          git -c core.autocrlf=false archive "$base" | tar -x -C "$source"
          {
            printf 'Base commit: %s\n' "$base"
            printf 'Base tree: %s\n' "$(git rev-parse "$base^{tree}")"
            printf 'No patch applied. Test source: '
            sha256sum "$source/internal/transport/transport_test.go"
          } | tee "$logs/source-hashes.txt"
          cd "$source"
          test ! -e internal/transport/flow_diagnostics_test.go
          test ! -e internal/transport/flow_diagnostics_linux_test.go
          go test ${{ matrix.flags }} -c -o "$RUNNER_TEMP/flow-transport.test" ./internal/transport
      - name: Prepare optional TCP tracing
        id: tcp_trace
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/flow-control-logs"
          setup_code=0
          available=false
          : > "$logs/trace-setup.txt"
          if ! command -v bpftrace >/dev/null; then
            sudo -n timeout --kill-after=5s 110s bash -c 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y --no-install-recommends bpftrace' >> "$logs/trace-setup.txt" 2>&1 || setup_code=$?
          fi
          if command -v bpftrace >> "$logs/trace-setup.txt" && bpftrace --version >> "$logs/trace-setup.txt" 2>&1 && [ -r /sys/kernel/btf/vmlinux ] && [ -r "$GITHUB_WORKSPACE/scripts/flow-control-tcp.bt" ]; then
            if sudo -n awk '$3 == "tcp_prune_queue" { found=1; print } END { exit !found }' /proc/kallsyms >> "$logs/trace-setup.txt" 2>&1; then
              available=true
            fi
          fi
          printf 'available=%s\n' "$available" >> "$GITHUB_OUTPUT"
          printf '{"available":%s,"installation_exit_code":%s}\n' "$available" "$setup_code" | tee "$logs/trace-availability.json"
          cat "$logs/trace-setup.txt"
      - name: Run unmodified target (1000 planned executions)
        id: target
        continue-on-error: true
        shell: bash
        env:
          TRACE_AVAILABLE: ${{ steps.tcp_trace.outputs.available || 'false' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/flow-control-source"
          logs="$RUNNER_TEMP/flow-control-logs"
          summarizer="$GITHUB_WORKSPACE/scripts/flow-control-summary.py"
          tracer=''
          trace_group=''
          trace_attached=false
          trace_alive_after_target=false
          trace_code=null
          : > "$logs/kernel-trace.txt"
          stop_trace() {
            if [ -n "$tracer" ]; then
              if [ -r "$logs/trace.pid" ]; then trace_group=$(cat "$logs/trace.pid"); fi
              if sudo -n kill -0 "$tracer" 2>/dev/null; then
                if [[ "$trace_group" =~ ^[1-9][0-9]*$ ]]; then
                  sudo -n kill -INT -- "-$trace_group" 2>/dev/null || true
                else
                  sudo -n kill -TERM "$tracer" 2>/dev/null || true
                fi
                if ! timeout 5s tail --pid="$tracer" -f /dev/null; then
                  if [[ "$trace_group" =~ ^[1-9][0-9]*$ ]]; then sudo -n kill -KILL -- "-$trace_group" 2>/dev/null || true; fi
                  sudo -n kill -KILL "$tracer" 2>/dev/null || true
                fi
              fi
              trace_code=0
              wait "$tracer" || trace_code=$?
              tracer=''
            fi
            trace_warnings=false
            if grep -Eiq 'ERROR:|WARNING:|lost [0-9]+ events|failed to' "$logs/kernel-trace.txt"; then trace_warnings=true; fi
            trace_events=$(grep -c '^TCP_RCVBUF_SHRINK ' "$logs/kernel-trace.txt" || true)
            printf '{"available":%s,"attached_before_target":%s,"alive_after_target":%s,"exit_code":%s,"warnings":%s,"shrink_events":%s,"filter":"IPv4 loopback"}\n' "$TRACE_AVAILABLE" "$trace_attached" "$trace_alive_after_target" "$trace_code" "$trace_warnings" "$trace_events" | tee "$logs/trace-session.json"
          }
          trap stop_trace EXIT
          if [ "$TRACE_AVAILABLE" = true ]; then
            trace_program=$(cat "$GITHUB_WORKSPACE/scripts/flow-control-tcp.bt"; printf '\ninterval:s:1 { printf("FLOW_TRACE_HEARTBEAT mono_ns=%%llu\\n", nsecs); }\n')
            sudo -n bash -c 'set -e; umask 022; printf "%s\n" "$$" > "$1"; shift; export BPFTRACE_MISSING_PROBES=error; exec timeout --kill-after=5s --signal=INT 11m bpftrace -B line -e "$1"' _ "$logs/trace.pid" "$trace_program" > "$logs/kernel-trace.txt" 2>&1 &
            tracer=$!
            for attempt in $(seq 1 15); do
              if grep -q '^FLOW_TRACE_HEARTBEAT ' "$logs/kernel-trace.txt" && ! grep -Eiq 'ERROR:|failed to attach' "$logs/kernel-trace.txt"; then
                trace_attached=true
                break
              fi
              if ! sudo -n kill -0 "$tracer" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$trace_attached" = false ]; then stop_trace; fi
          fi
          date --utc --iso-8601=ns > "$logs/target-start.txt"
          cat /proc/uptime >> "$logs/target-start.txt"
          target_code=0
          timeout --kill-after=5s 10m go tool test2json -t -p google.golang.org/grpc/internal/transport "$RUNNER_TEMP/flow-transport.test" -test.v=test2json -test.run '^Test$/^AccountCheckWindowSizeWithLargeWindow$' -test.cpu 1,4 -test.count 500 -test.timeout 10m > "$logs/target.jsonl" 2>&1 || target_code=$?
          if [ -n "$tracer" ] && sudo -n kill -0 "$tracer" 2>/dev/null; then trace_alive_after_target=true; fi
          stop_trace
          trap - EXIT
          count_code=0
          python3 - "$logs/target.jsonl" "$logs/target-counts.json" <<'PY' || count_code=$?
          from collections import Counter
          import json, pathlib, sys
          counts = Counter()
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get("Test") == "Test/AccountCheckWindowSizeWithLargeWindow" and event.get("Action") in ("pass", "fail"):
                  counts[event["Action"]] += 1
          result = {"pass": counts["pass"], "fail": counts["fail"], "completed": sum(counts.values()), "expected": 1000}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(result) + "\n")
          print(json.dumps(result))
          sys.exit(0 if counts["pass"] == 1000 and counts["fail"] == 0 else 1)
          PY
          if [ "$target_code" -eq 0 ] && [ "$count_code" -ne 0 ]; then target_code="$count_code"; fi
          printf 'exit_code=%s\n' "$target_code" >> "$GITHUB_OUTPUT"
          printf '{"stage":"target","exit_code":%s,"planned_target_executions":1000}\n' "$target_code" | tee -a "$logs/results.jsonl"
          python3 "$summarizer" "$logs/target.jsonl" | tee "$logs/target-summary.txt"
          exit "$target_code"
      - name: Run unmodified root module
        id: root_module
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/flow-control-source"
          logs="$RUNNER_TEMP/flow-control-logs"
          summarizer="$GITHUB_WORKSPACE/scripts/flow-control-summary.py"
          root_code=0
          timeout --kill-after=5s 9m go test -json ${{ matrix.flags }} -cpu 1,4 -timeout 7m ./... > "$logs/root-module.jsonl" 2>&1 || root_code=$?
          printf 'exit_code=%s\n' "$root_code" >> "$GITHUB_OUTPUT"
          printf '{"stage":"root-module","exit_code":%s}\n' "$root_code" | tee -a "$logs/results.jsonl"
          python3 "$summarizer" "$logs/root-module.jsonl" | tee "$logs/root-module-summary.txt"
          exit "$root_code"
      - name: Report verification result
        if: always()
        shell: bash
        env:
          TARGET_EXIT: ${{ steps.target.outputs.exit_code || 'not run' }}
          ROOT_EXIT: ${{ steps.root_module.outputs.exit_code || 'not run' }}
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          ROOT_OUTCOME: ${{ steps.root_module.outcome }}
        run: |
          set -euo pipefail
          {
            printf '| Stage | Exit status |\n| --- | --- |\n'
            printf '| Unmodified target (1000 required passing executions) | %s |\n' "$TARGET_EXIT"
            printf '| Unmodified root module | %s |\n' "$ROOT_EXIT"
            printf '\nTarget and root-module results determine the job result. Optional trace failures are recorded separately. This compares complete runner images.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$TARGET_EXIT" = 0 && test "$ROOT_EXIT" = 0 && test "$TARGET_OUTCOME" = success && test "$ROOT_OUTCOME" = success
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-${{ matrix.name }}
          path: ${{ runner.temp }}/flow-control-logs
          retention-days: 7
